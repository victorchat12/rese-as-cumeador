<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página de Reseñas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      margin: 0;
    }

    header {
      background: #1e293b;
      padding: 30px;
      text-align: center;
    }

    header h1 {
      color: #38bdf8;
    }

    .contenedor {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .reseña {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .estrellas {
      color: #facc15;
      font-size: 25px;
    }

    .formulario {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-family: Arial;
    }

    textarea {
      min-height: 100px;
    }

    button {
      background: #38bdf8;
      color: #101827;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #1e293b;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Reseñas el Cumeador</h1>
    <p>Comparte tus opiniones y experiencias</p>
  </header>

  <div class="contenedor">

    <h2>Reseñas de usuarios</h2>

    <div id="listaReseñas">

      <div class="reseña">
        <h3>Tu puta madre</h3>
        <div class="estrellas">★★★★★</div>
        <p>Excelente página, muy recomendada.</p>
      </div>

      <div class="reseña">
        <h3>thrian sex</h3>
        <div class="estrellas">★★★★☆</div>
        <p>Muy buena experiencia, me gustó mucho.</p>
      </div>

    </div>

    <div class="formulario">
      <h2>Escribe tu reseña</h2>

      <input type="text" id="nombre" placeholder="Tu nombre">

      <select id="calificacion">
        <option value="5">⭐⭐⭐⭐⭐ - Excelente</option>
        <option value="4">⭐⭐⭐⭐ - Muy bueno</option>
        <option value="3">⭐⭐⭐ - Bueno</option>
        <option value="2">⭐⭐ - Regular</option>
        <option value="1">⭐ - Malo</option>
      </select>

      <textarea id="comentario" placeholder="Escribe tu opinión..."></textarea>

      <button onclick="publicarReseña()">
        Publicar reseña
      </button>
    </div>

  </div>

  <footer>
    <p>2026 Cum Reseñas</p>
  </footer>

  <script>
    function publicarReseña() {
      let nombreInput = document.getElementById("nombre");
      let comentarioInput = document.getElementById("comentario");
      let calificacionSelect = document.getElementById("calificacion");

      let nombre = nombreInput.value.trim();
      let comentario = comentarioInput.value.trim();
      let calificacion = Number(calificacionSelect.value);

      if (nombre === "" || comentario === "") {
        alert("Completa todos los campos");
        return;
      }

      let nuevaReseña = document.createElement("div");
      nuevaReseña.className = "reseña";

      let titulo = document.createElement("h3");
      titulo.textContent = nombre;

      let estrellas = document.createElement("div");
      estrellas.className = "estrellas";
      estrellas.textContent = "★".repeat(calificacion) + "☆".repeat(5 - calificacion);

      let texto = document.createElement("p");
      texto.textContent = comentario;

      nuevaReseña.appendChild(titulo);
      nuevaReseña.appendChild(estrellas);
      nuevaReseña.appendChild(texto);

      document.getElementById("listaReseñas").prepend(nuevaReseña);

      nombreInput.value = "";
      comentarioInput.value = "";

      alert("¡Reseña publicada!");
    }
  </script>

</body>
</html>
